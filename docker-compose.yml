services:
  postgres:
    image: postgres:16
    container_name: vocabulary-postgres
    environment:
      POSTGRES_USER: vocab
      POSTGRES_PASSWORD: vocab
      POSTGRES_DB: vocabulary
    ports:
      - "5432:5432"
    volumes:
      - vocab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocab -d vocabulary"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vocab_pgdata: