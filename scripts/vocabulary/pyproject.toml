[project]
name = "vocabulary-pipeline"
version = "0.1.0"
description = "English-Polish vocabulary ETL pipeline (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
fuzzy = ["rapidfuzz>=3.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
vocabulary-pipeline = "vocabulary_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]